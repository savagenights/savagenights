<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1280 640" role="img" aria-label="savagenights">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="scan" width="1280" height="4" patternUnits="userSpaceOnUse">
      <rect width="1280" height="1" fill="#000" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <image href="banner.png" width="1280" height="640" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1280" height="640" fill="url(#scan)"/>
  <rect y="390" width="1280" height="250" fill="url(#scrim)"/>

  <line x1="72" y1="470" x2="210" y2="470" stroke="#c6a15b" stroke-width="1.5"/>
  <text x="72" y="530" fill="#f3ead7" font-family="Georgia, 'Times New Roman', serif" font-size="64" filter="url(#glow)">savagenights</text>
  <text x="72" y="574" fill="#d7c4a3" font-family="Georgia, 'Times New Roman', serif" font-size="22">fablforge.com</text>
</svg>
